name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run JS suite before shipping
        run: npm test
      - name: Regenerate SW precache list from actual assets
        run: node scripts/gen-precache.mjs && grep -c "index.html" sw.js
      - name: Stamp service worker with deploy SHA
        run: sed -i "s/__MM_CACHE_VERSION__/mm-${GITHUB_SHA::7}/" sw.js && grep -o "CACHE_VERSION = 'mm-[a-f0-9]*'" sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
